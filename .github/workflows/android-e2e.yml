name: Android E2E smoke
on:
  workflow_dispatch:
  pull_request:
jobs:
  check-key:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.key.outputs.available }}
    steps:
      - id: key
        env:
          MAPKIT_TEST_KEY: ${{ secrets.MAPKIT_TEST_KEY }}
        run: |
          if [ -n "$MAPKIT_TEST_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'MAPKIT_TEST_KEY is missing; emulator tests were not run.' >> "$GITHUB_STEP_SUMMARY"
          fi
  e2e:
    needs: check-key
    if: needs.check-key.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAPKIT_TEST_KEY: ${{ secrets.MAPKIT_TEST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare isolated configuration
        run: |
          python3 - <<'PY'
          import json, os
          key = os.environ.get('MAPKIT_TEST_KEY', '')
          if not key:
              raise SystemExit('Set the MAPKIT_TEST_KEY repository secret before running E2E.')
          values = {'MAPKIT_API_KEY': key, 'API_URL': 'http://10.0.2.2:18080', 'SERVER_URL': 'http://10.0.2.2:18080', 'USERNAME': 'fixture', 'PASSWORD': 'fixture'}
          with open('apikey.properties', 'w') as f:
              for name, value in values.items():
                  f.write(name + '=' + json.dumps(value) + '\n')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI scenarios on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            python3 scripts/e2e_fixture.py &
            FIXTURE_PID=$!
            trap 'kill "$FIXTURE_PID"' EXIT
            ./gradlew :composeApp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.placy.MapE2ETest
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results
          path: |
            composeApp/build/reports/androidTests/
            composeApp/build/outputs/androidTest-results/
          if-no-files-found: warn
